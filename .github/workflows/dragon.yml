name: Generate Contribution Dragon & Animated Activity Graph

on:
  schedule:
    - cron: "0 */12 * * *" # Every 12 hours
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate GitHub Contribution Grid Runner
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-dragon.svg
            dist/github-contribution-grid-dragon-dark.svg?palette=github-dark&color_snake=#38bdf8

      - name: Fix permissions
        run: sudo chown -R $USER:$USER dist/

      - name: Transform Runner into Mythical Azure Dragon
        run: |
          python3 scripts/transform_dragon.py dist/github-contribution-grid-dragon.svg dist/github-contribution-grid-dragon-dark.svg

      - name: Generate Animated Activity Graph
        run: |
          python3 scripts/generate_animated_activity.py dist/activity-graph.svg

      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
